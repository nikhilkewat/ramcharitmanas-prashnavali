<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0f05"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1a0f05"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative border -->
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>
  <rect x="30" y="30" width="1140" height="570" rx="12" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.2"/>
  <!-- OM symbol -->
  <text x="600" y="200" font-size="100" text-anchor="middle" fill="#d97706" opacity="0.15" font-family="serif">ॐ</text>
  <!-- Title -->
  <text x="600" y="300" font-size="64" text-anchor="middle" fill="#fde68a" font-family="serif" font-weight="bold">श्री राम प्रश्नावली</text>
  <text x="600" y="360" font-size="36" text-anchor="middle" fill="#f59e0b" font-family="sans-serif">Ram Prashnavali</text>
  <!-- Subtitle -->
  <text x="600" y="420" font-size="24" text-anchor="middle" fill="#fbbf24" font-family="serif" opacity="0.8">रामचरितमानस · गोस्वामी तुलसीदास</text>
  <!-- Decorative corners -->
  <text x="50" y="70" font-size="24" fill="#d97706" opacity="0.3" font-family="serif">❁</text>
  <text x="1130" y="70" font-size="24" fill="#d97706" opacity="0.3" font-family="serif">❁</text>
  <text x="50" y="590" font-size="24" fill="#d97706" opacity="0.3" font-family="serif">❁</text>
  <text x="1130" y="590" font-size="24" fill="#d97706" opacity="0.3" font-family="serif">❁</text>
  <!-- Bottom line -->
  <line x1="200" y1="470" x2="1000" y2="470" stroke="#d97706" stroke-width="1" opacity="0.3"/>
  <text x="600" y="510" font-size="20" text-anchor="middle" fill="#92400e" font-family="sans-serif">ramcharitmanas.vercel.app</text>
